<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Fichas PDF em Lote</title>
  <!-- Carrega a biblioteca pdf-lib via CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      color: #1a202c;
    }
    .controls-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
      background: #edf2f7;
      padding: 0.75rem 1rem;
      border-radius: 6px;
    }
    .controls-row label {
      font-weight: 600;
      font-size: 14px;
    }
    .controls-row input[type="date"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2c5282;
    }
    button.secondary {
      background-color: #4a5568;
    }
    button.secondary:hover {
      background-color: #2d3748;
    }
    #status {
      font-size: 14px;
      font-weight: 500;
    }
    .error { color: #e53e3e; }
    .success { color: #38a169; }
    iframe {
      width: 100%;
      height: 600px;
      margin-top: 1.5rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Fichas de Anestesia</h1>
    
    <div class="controls-row">
      <label for="referenceDate">Data da ficha (padrão amanhã):</label>
      <input type="date" id="referenceDate">
    </div>

    <p>Cole abaixo o código gerado:</p>
    
    <textarea id="jsonInput">[
  </textarea>

    <div class="actions">
      <button onclick="gerarPDF()">Gerar PDF</button>
      <button class="secondary" onclick="gerarPDF(true)">Visualizar na Tela</button>
      <span id="status"></span>
    </div>

    <iframe id="pdfPreview"></iframe>
  </div>
